theme = "tokyonight_storm"

[editor]
line-number = "relative"
bufferline = "always"
color-modes = true
rulers = [80]

# Minimum severity to show a diagnostic after the end of a line
end-of-line-diagnostics = "hint"

[editor.auto-pairs]
'(' = ')'
'{' = '}'
'[' = ']'
'"' = '"'
"'" = "'"
'`' = '`'
'<' = '>'

[editor.cursor-shape] 
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false

# ctx7sk-4d82aa2c-c6ca-4c69-9a73-1c36f9708a4b

[editor.indent-guides]
render = true
character = "▏" # Some characters that work well: "▏", "┆", "┊", "⸽"
skip-levels = 1

[editor.statusline]
left = ["mode", "spinner", "file-name", "file-modification-indicator"]
right = ["version-control", "diagnostics", "selections", "position", "file-encoding", "file-line-ending", "file-type"]
separator = "│"
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"

[editor.inline-diagnostics]
cursor-line = "error" # Show inline diagnostics when the cursor is on the line
other-lines = "disable" # Don't expand diagnostics unless the cursor is on the line

[keys.insert]
C-k = "move_line_up"
C-j = "move_line_down"
C-h = "move_char_left"
C-l = "move_char_right"
f = { j = "normal_mode" } # Maps "fj" to exit insert mode
j = { f = "normal_mode" } # Maps "jf" to exit insert mode

[keys.normal]
esc = ["collapse_selection", "keep_primary_selection"]
G = "goto_file_end"
X = "extend_line_above"
C-e = "scroll_down"
C-y = "scroll_up"
"}" = "goto_next_paragraph"
"{" = "goto_prev_paragraph"

[keys.select]
"}" = "goto_next_paragraph"
"{" = "goto_prev_paragraph"

[keys.normal.space]
l = ":toggle lsp.display-inlay-hints"
